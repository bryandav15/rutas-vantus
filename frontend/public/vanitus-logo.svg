<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <!-- Outer Box with Crisp Border -->
  <rect x="6" y="6" width="508" height="118" fill="#ffffff" stroke="#111827" stroke-width="9" />

  <!-- Letters and Vertical Separators -->
  <g fill="#111827" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="78" font-weight="900" text-anchor="middle" letter-spacing="1">
    <!-- V -->
    <text x="50" y="93" font-size="78" font-weight="800">V</text>
    
    <!-- Bar 1 -->
    <rect x="88" y="24" width="6.5" height="82" rx="1" />

    <!-- A -->
    <text x="130" y="93" font-size="78" font-weight="800">A</text>

    <!-- Bar 2 -->
    <rect x="170" y="24" width="6.5" height="82" rx="1" />

    <!-- N -->
    <text x="212" y="93" font-size="78" font-weight="800">N</text>

    <!-- Bar 3 -->
    <rect x="254" y="24" width="6.5" height="82" rx="1" />

    <!-- I -->
    <text x="286" y="93" font-size="78" font-weight="800">I</text>

    <!-- Bar 4 -->
    <rect x="318" y="24" width="6.5" height="82" rx="1" />

    <!-- T -->
    <text x="354" y="93" font-size="78" font-weight="800">T</text>

    <!-- Bar 5 -->
    <rect x="390" y="24" width="6.5" height="82" rx="1" />

    <!-- U -->
    <text x="428" y="93" font-size="78" font-weight="800">U</text>

    <!-- Bar 6 -->
    <rect x="466" y="24" width="6.5" height="82" rx="1" />

    <!-- S -->
    <text x="495" y="93" font-size="78" font-weight="800">S</text>
  </g>
</svg>
